<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelLoop × WALLX</title>
<style>
  :root{
    --ink:#23282e; --ink2:#5b6570; --paper:#fdfcf6; --rule:rgba(47,111,208,.10);
    --blue:#2f6fd0; --red:#c0392b; --green:#2e8b57; --amber:#c98a1b; --violet:#7c6ce0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font:14px/1.35 ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink); background-color:var(--paper);
    background-image:linear-gradient(to right,var(--rule) 1px,transparent 1px),
                     linear-gradient(to bottom,var(--rule) 1px,transparent 1px);
    background-size:18.9px 18.9px;
  }
  body::before{content:"";position:fixed;left:62px;top:0;bottom:0;width:1px;background:#e6babb;opacity:.85;z-index:0}
  header{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
    padding:12px 22px 10px 78px;border-bottom:1px dashed rgba(35,40,46,.3)}
  h1{margin:0;font-size:19px;letter-spacing:.4px}
  h1 .x{color:var(--red);font-weight:400}
  .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  select,button,input[type=range]{font:inherit;color:inherit}
  select,button{background:#fffaf0;border:1.4px solid var(--ink);
    border-radius:9px 5px 10px 6px / 6px 10px 5px 9px;padding:3px 8px;cursor:pointer}
  button:active{transform:translateY(1px)}
  input[type=range]{width:200px;accent-color:var(--ink)}
  .speeds{display:flex;gap:4px}
  .speeds button{padding:2px 7px;font-size:12px}
  .speeds button.on{background:var(--ink);color:var(--paper)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .chip{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1.3px solid rgba(35,40,46,.35);
    color:var(--ink2);background:rgba(255,255,255,.55);transition:all .18s ease;white-space:nowrap}
  .chip b{font-variant-numeric:tabular-nums}
  .chip.on{color:#111;border-color:var(--ink);background:#fff;
    box-shadow:0 0 0 2px rgba(47,111,208,.14);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  main{position:relative;z-index:1;display:grid;gap:14px;padding:14px 22px 60px 78px;
    grid-template-columns:minmax(0,2fr) minmax(290px,1fr);
    grid-template-areas:"table pose" "table perf" "cams log" "time log"}
  #tableCard{grid-area:table} #poseCard{grid-area:pose} #perfCard{grid-area:perf}
  #camCard{grid-area:cams} #timeCard{grid-area:time} #logCard{grid-area:log}
  .card{background:rgba(255,255,255,.62);border:1.6px solid var(--ink);
    border-radius:14px 9px 16px 8px / 9px 16px 8px 14px;padding:9px 11px 11px;min-width:0}
  .cardTitle{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
  #tableSvg{width:100%;height:auto;display:block}
  .armGlow{filter:drop-shadow(0 0 2px rgba(35,40,46,.55))}
  .muted{color:var(--ink2);font-size:12px}
  .armRow{display:grid;grid-template-columns:36px 1fr 64px;gap:6px;align-items:center;margin:5px 0}
  .armName{font-weight:700;font-size:12px}
  .armName.left{color:var(--blue)} .armName.right{color:var(--red)}
  .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 6px;font-size:11.5px;font-variant-numeric:tabular-nums}
  .vals i{color:var(--ink2);font-style:normal;font-size:10px}
  .spark{width:64px;height:18px}
  .perfTop{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-bottom:4px}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;
    border-bottom:1px dotted rgba(35,40,46,.22);padding:1px 0}
  .kv b{font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cams figure{margin:0}
  .cams img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1.4px solid var(--ink);
    border-radius:10px 6px 11px 7px / 7px 11px 6px 10px;background:#0f1214;display:block}
  .cams figcaption{font-size:10.5px;color:var(--ink2);text-align:center;margin-top:2px}
  .tl{position:relative;height:34px;border:1.3px solid rgba(35,40,46,.5);border-radius:8px;
    overflow:hidden;background:#fff}
  .tlSeg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
    font-size:9.5px;color:#10151a;overflow:hidden;white-space:nowrap;border-right:1px solid rgba(255,255,255,.6)}
  .tlTick{position:absolute;top:0;height:6px;width:1px;background:rgba(35,40,46,.55)}
  .tlHead{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--red);
    box-shadow:0 0 4px rgba(192,57,43,.7)}
  .log{max-height:380px;overflow:auto;font-size:12px;font-variant-numeric:tabular-nums}
  .logRow{padding:2px 4px;border-radius:6px;border-left:3px solid transparent;word-break:break-word}
  .logRow.hi{background:#fff6d8;border-left-color:var(--amber)}
  .lt{color:var(--ink2);margin-right:7px;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>LabelLoop <span class="x">×</span> WALLX</h1>
  <div class="ctl">
    <label for="trialPicker" class="muted">trial</label>
    <select id="trialPicker"><option value="__live__">Live</option></select>
    <button id="playBtn" title="play / pause (space)">▶</button>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1" title="scrub">
    <span class="speeds" id="speeds"></span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <section class="card" id="tableCard">
    <div class="cardTitle">table · top view (cm)</div>
    <svg id="tableSvg" role="img" aria-label="top-down table view">
      <g id="static"></g>
      <g id="dyn"></g>
    </svg>
  </section>
  <section class="card" id="poseCard">
    <div class="cardTitle">pose</div>
    <div id="pose"><div class="muted">waiting…</div></div>
  </section>
  <section class="card" id="perfCard">
    <div class="cardTitle">performance</div>
    <div id="perf"><div class="muted">waiting…</div></div>
  </section>
  <section class="card" id="camCard">
    <div class="cardTitle">cameras</div>
    <div class="cams" id="cams"></div>
  </section>
  <section class="card" id="timeCard">
    <div class="cardTitle">state timeline</div>
    <div id="timeline"><div class="muted">waiting for a trial…</div></div>
  </section>
  <section class="card" id="logCard">
    <div class="cardTitle">log</div>
    <div class="log" id="log"><div class="muted">nothing yet</div></div>
  </section>
</main>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ tunables */
  const CFG = {
    TABLE: { w: 111, h: 68.5 },          // cm; origin near-left, x right, y away from the robot
    PAD: 9,                              // cm margin in the drawing
    BINS: {                              // x/y = near-left corner in table cm
      blue:  { x: 30, y: 38.5, w: 20, h: 30 },
      red:   { x: 62, y: 38.5, w: 20, h: 30 },
      black: { x: 87, y: 19.0, w: 22, h: 30 }
    },
    ARM_HOME: { left: [30, 12], right: [81, 12] },   // cm
    BASES:    { left: [20, 0],  right: [91, 0] },    // arm bases on the near edge, cm
    AXIS: { x: { from: 1, sign: -1, scale: 100, offset: 0 },    // table_x = -ee_y   (m -> cm)
            y: { from: 0, sign:  1, scale: 100, offset: 0 } },  // table_y =  ee_x
    CAMERAS: ['front', 'left_wrist', 'right_wrist'],
    MOVE_CM_S: 6,        // ee speed above which the arm glows / leaves a trail
    CASE_S: 480,         // the event case clock
    POLL_MS: 300
  };

  const S = {
    trials: [], id: null, meta: null, summary: null, rows: [],
    follow: true, playing: false, speed: 1, cursor: 0, after: -1,
    pose: null, prev: { left: null, right: null }, trail: { left: [], right: [] },
    hist: { left: { z: [], g: [] }, right: { z: [], g: [] } },
    shownFrame: -1, shownRow: -1, logHi: -1, busy: false, summaryAt: 0,
    lastPaint: 0, lastSlow: 0
  };

  const $ = (id) => document.getElementById(id);
  const n1 = (v) => (Math.round(v * 10) / 10).toFixed(1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mm = (v) => (v * 1000).toFixed(0);
  const deg = (v) => (v * 180 / Math.PI).toFixed(1);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ------------------------------------------------------------------ geometry */
  function tv(p) { return [p[0], CFG.TABLE.h - p[1]]; }          // table cm -> svg cm

  function eeToTable(pos) {
    const X = CFG.AXIS.x, Y = CFG.AXIS.y;
    return [X.sign * X.scale * pos[X.from] + X.offset,
            Y.sign * Y.scale * pos[Y.from] + Y.offset];
  }

  const svg = $('tableSvg');
  svg.setAttribute('viewBox',
    (-CFG.PAD) + ' ' + (-CFG.PAD) + ' ' + (CFG.TABLE.w + 2 * CFG.PAD) + ' ' + (CFG.TABLE.h + 2 * CFG.PAD));

  function buildStatic() {
    const T = CFG.TABLE, g = [];
    g.push('<rect x="0" y="0" width="' + T.w + '" height="' + T.h +
      '" rx="1.4" fill="#f4f8f1" stroke="#23282e" stroke-width="0.55"/>');
    for (let x = 10; x < T.w; x += 10)
      g.push('<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + T.h + '" stroke="#dbe7d6" stroke-width="0.22"/>');
    for (let y = 10; y < T.h; y += 10)
      g.push('<line x1="0" y1="' + (T.h - y) + '" x2="' + T.w + '" y2="' + (T.h - y) +
        '" stroke="#dbe7d6" stroke-width="0.22"/>');
    const col = { blue: '#2f6fd0', red: '#c0392b', black: '#2b2b2b' };
    Object.keys(CFG.BINS).forEach(function (k) {
      const b = CFG.BINS[k], y = T.h - b.y - b.h;
      g.push('<rect x="' + b.x + '" y="' + n1(y) + '" width="' + b.w + '" height="' + b.h +
        '" rx="1.1" fill="' + col[k] + '" fill-opacity="0.13" stroke="' + col[k] +
        '" stroke-width="0.45" stroke-dasharray="2 1.1"/>');
      g.push('<text x="' + n1(b.x + b.w / 2) + '" y="' + n1(y + b.h - 1.8) +
        '" text-anchor="middle" font-size="2.6" fill="' + col[k] + '">' + k + '</text>');
    });
    g.push('<text x="' + n1(T.w / 2) + '" y="' + n1(T.h + 4.8) +
      '" text-anchor="middle" font-size="2.6" fill="#5b6570">robot side</text>');
    ['left', 'right'].forEach(function (a) {
      const h = tv(CFG.ARM_HOME[a]);
      g.push('<path d="M' + n1(h[0] - 1.2) + ' ' + n1(h[1]) + 'H' + n1(h[0] + 1.2) +
        'M' + n1(h[0]) + ' ' + n1(h[1] - 1.2) + 'V' + n1(h[1] + 1.2) +
        '" stroke="#8a94a0" stroke-width="0.3"/>');
    });
    ['left', 'right'].forEach(function (a) {
      const b = tv(CFG.BASES[a]);
      g.push('<circle cx="' + n1(b[0]) + '" cy="' + n1(b[1]) + '" r="1.5" fill="#23282e" opacity="0.65"/>');
    });
    $('static').innerHTML = g.join('');
  }

  /* ------------------------------------------------------------------ scene paint */
  function paintScene(pose, row) {
    const now = performance.now(), T = CFG.TABLE, out = [];
    ['left', 'right'].forEach(function (arm) {
      const a = pose[arm + '_ee'];
      if (!a) return;
      const ep = tv(eeToTable(a.p)), bp = tv(CFG.BASES[arm]);
      const ex = ep[0], ey = ep[1], bx = bp[0], by = bp[1];

      const pv = S.prev[arm];
      const spd = pv ? Math.hypot(ex - pv.x, ey - pv.y) / Math.max(0.016, (now - pv.t) / 1000) : 0;
      S.prev[arm] = { x: ex, y: ey, t: now };
      const moving = spd > CFG.MOVE_CM_S;

      const tr = S.trail[arm];
      if (!tr.length || Math.hypot(ex - tr[tr.length - 1].x, ey - tr[tr.length - 1].y) > 0.2)
        tr.push({ x: ex, y: ey, t: now });
      while (tr.length && now - tr[0].t > 1400) tr.shift();
      for (let i = 1; i < tr.length; i++)
        out.push('<line x1="' + n1(tr[i - 1].x) + '" y1="' + n1(tr[i - 1].y) + '" x2="' + n1(tr[i].x) +
          '" y2="' + n1(tr[i].y) + '" stroke="#2f8f9d" stroke-width="0.8" stroke-linecap="round" stroke-opacity="' +
          (i / tr.length * 0.4).toFixed(2) + '"/>');

      const acts = row && row.actions && row.actions[arm + '_ee'];
      if (acts && Array.isArray(acts.position) && acts.position.length > 1) {
        const pts = acts.position.map(function (p) { return tv(eeToTable(p)); });
        out.push('<polyline points="' + pts.map(function (p) { return n1(p[0]) + ',' + n1(p[1]); }).join(' ') +
          '" fill="none" stroke="#2e8b57" stroke-width="0.38" stroke-dasharray="1.5 1.1" stroke-linejoin="round" opacity="0.85"/>');
      }

      const z = clamp(a.p[2] || 0, 0, 0.5);
      out.push('<ellipse cx="' + n1(ex) + '" cy="' + n1(ey) + '" rx="' + n1(1.9 + z * 7) +
        '" ry="' + n1(1.0 + z * 3.4) + '" fill="#23282e" opacity="' +
        (0.16 - Math.min(0.11, z * 0.35)).toFixed(2) + '"/>');

      out.push('<line x1="' + n1(bx) + '" y1="' + n1(by) + '" x2="' + n1(ex) + '" y2="' + n1(ey) +
        '" stroke="' + (moving ? '#23282e' : '#4a5560') + '" stroke-width="' + (moving ? 0.95 : 0.6) +
        '" stroke-linecap="round"' + (moving ? ' class="armGlow"' : '') + '/>');

      const dx = ex - bx, dy = ey - by, d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d, nx = -uy, ny = ux;
      const half = 0.45 + 3.0 * clamp(a.gripper || 0, 0, 1);
      const tx = ex + ux * 3.1, ty = ey + uy * 3.1;
      out.push('<path d="M' + n1(tx + nx * half) + ' ' + n1(ty + ny * half) + 'L' + n1(ex) + ' ' + n1(ey) +
        'L' + n1(tx - nx * half) + ' ' + n1(ty - ny * half) +
        '" fill="none" stroke="#23282e" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>');

      const zx = T.w + 4.5 + (arm === 'left' ? 0 : 2.8);
      const zh = clamp((a.p[2] || 0) / 0.4, 0, 1) * T.h;
      out.push('<rect x="' + n1(zx) + '" y="' + n1(T.h - zh) + '" width="1.7" height="' + n1(zh) +
        '" rx="0.6" fill="' + (arm === 'left' ? '#2f6fd0' : '#c0392b') + '" opacity="0.5"/>');
      out.push('<line x1="' + n1(zx - 0.4) + '" y1="' + T.h + '" x2="' + n1(zx + 2.1) +
        '" y2="' + T.h + '" stroke="#8a94a0" stroke-width="0.3"/>');
    });
    $('dyn').innerHTML = out.join('');
  }

  /* ------------------------------------------------------------------ rows / poses */
  function rowAt(cursor) {
    if (!S.rows.length) return null;
    return S.rows[clamp(Math.round(cursor), 0, S.rows.length - 1)];
  }

  function poseAt(cursor) {
    const rows = S.rows;
    if (!rows.length) return null;
    const i = clamp(Math.floor(cursor), 0, rows.length - 1);
    const j = Math.min(rows.length - 1, i + 1);
    const f = clamp(cursor - i, 0, 1);
    const A = rows[i] && rows[i].state, B = rows[j] && rows[j].state;
    const st = A || B;
    if (!st) return null;
    const out = {};
    ['left_ee', 'right_ee'].forEach(function (k) {
      const a = (A && A[k]) || st[k], b = (B && B[k]) || a;
      if (!a || !b || !a.position || !b.position) return;
      const ar = a.rotation_rpy || [0, 0, 0], br = b.rotation_rpy || [0, 0, 0];
      out[k] = {
        p: [0, 1, 2].map(function (n) { return lerp(a.position[n], b.position[n], f); }),
        rpy: [0, 1, 2].map(function (n) { return lerp(ar[n], br[n], f); }),
        gripper: lerp(a.gripper || 0, b.gripper || 0, f)
      };
    });
    return (out.left_ee || out.right_ee) ? out : null;
  }

  function smoothPose(cur, next, dt) {
    if (!next) return cur;
    if (!cur) return next;
    const k = 1 - Math.exp(-dt * 12), out = {};
    Object.keys(next).forEach(function (key) {
      const a = cur[key] || next[key], b = next[key];
      out[key] = {
        p: [0, 1, 2].map(function (n) { return lerp(a.p[n], b.p[n], k); }),
        rpy: [0, 1, 2].map(function (n) { return lerp(a.rpy[n], b.rpy[n], k); }),
        gripper: lerp(a.gripper, b.gripper, k)
      };
    });
    return out;
  }

  /* ------------------------------------------------------------------ side panels */
  function spark(vals) {
    if (!vals || vals.length < 2) return '';
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const span = (hi - lo) || 1e-6;
    const pts = vals.map(function (v, i) {
      return (i / (vals.length - 1) * 58 + 1).toFixed(1) + ',' + (17 - (v - lo) / span * 16).toFixed(1);
    });
    return '<polyline points="' + pts.join(' ') +
      '" fill="none" stroke="#5b6570" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>';
  }

  function renderPoseVals(pose) {
    let html = '';
    ['left', 'right'].forEach(function (arm) {
      const a = pose[arm + '_ee'];
      if (!a) return;
      const h = S.hist[arm];
      h.z.push(a.p[2]); if (h.z.length > 40) h.z.shift();
      h.g.push(a.gripper); if (h.g.length > 40) h.g.shift();
      html += '<div class="armRow">' +
        '<div class="armName ' + arm + '">' + arm + '</div>' +
        '<div class="vals">' +
          '<span><i>x</i> ' + mm(a.p[0]) + '</span>' +
          '<span><i>y</i> ' + mm(a.p[1]) + '</span>' +
          '<span><i>z</i> ' + mm(a.p[2]) + '</span>' +
          '<span><i>grip</i> ' + Math.round(clamp(a.gripper, 0, 1) * 100) + '%</span>' +
          '<span><i>r</i> ' + deg(a.rpy[0]) + '</span>' +
          '<span><i>p</i> ' + deg(a.rpy[1]) + '</span>' +
          '<span><i>yaw</i> ' + deg(a.rpy[2]) + '</span>' +
          '<span></span>' +
        '</div>' +
        '<svg class="spark" viewBox="0 0 60 18" preserveAspectRatio="none">' + spark(h.z) + '</svg>' +
      '</div>';
    });
    $('pose').innerHTML = html || '<div class="muted">waiting…</div>';
  }

  const CHIPS = [['harness', 'Harness'], ['wallx', 'WALLX'], ['scripted', 'Scripted'],
                 ['hold', 'HOLD'], ['qr', 'QR decode'], ['verify', 'Verify']];

  function buildChips() {
    $('chips').innerHTML = CHIPS.map(function (c) {
      return '<span class="chip" id="chip_' + c[0] + '">' + c[1] + '</span>';
    }).join('');
  }

  function setChip(key, on, extra) {
    const el = $('chip_' + key);
    if (!el) return;
    el.className = 'chip' + (on ? ' on' : '');
    const label = CHIPS.filter(function (c) { return c[0] === key; })[0][1];
    el.innerHTML = label + (on && extra ? ' <b>' + esc(extra) + '</b>' : '');
  }

  function renderChips(row) {
    const h = (row && row.harness) || {};
    setChip('harness', !!h.state, h.state);
    setChip('wallx', !!row && row.source === 'wallx',
      row && typeof row.latency_ms === 'number' ? Math.round(row.latency_ms) + 'ms' : '');
    setChip('scripted', !!row && row.source === 'scripted');
    setChip('hold', !!row && row.source === 'hold');
    setChip('qr', !!(h.codes && h.codes.length), (h.codes || []).length ? (h.codes.length + '') : '');
    setChip('verify', !!(h.confirmed && h.confirmed.length));
  }

  function spentS() {
    const rows = S.rows;
    for (let i = rows.length - 1; i >= 0; i--) {
      const h = rows[i].harness;
      if (h && typeof h.spent_s === 'number') return h.spent_s;
    }
    if (rows.length > 1) return Math.max(0, (rows[rows.length - 1].t || 0) - (rows[0].t || 0));
    return (S.summary && S.summary.duration_s) || 0;
  }

  function renderPerf(row) {
    const rows = S.rows;
    const wallx = rows.filter(function (r) { return r.source === 'wallx'; }).length;
    const lat = rows.map(function (r) { return typeof r.latency_ms === 'number' ? r.latency_ms : null; })
      .filter(function (v) { return v != null; }).sort(function (a, b) { return a - b; });
    const mean = lat.length ? lat.reduce(function (s, v) { return s + v; }, 0) / lat.length : null;
    const p95 = lat.length ? lat[Math.min(lat.length - 1, Math.ceil(lat.length * 0.95) - 1)] : null;
    const spent = spentS();
    const frac = clamp(spent / CFG.CASE_S, 0, 1);
    const C = 2 * Math.PI * 17;
    const h = (row && row.harness) || {};
    const parcels = h.parcels != null ? h.parcels
      : (S.summary && S.summary.parcels != null ? S.summary.parcels : '—');
    $('perf').innerHTML =
      '<div class="perfTop">' +
        '<svg width="52" height="52" viewBox="0 0 44 44">' +
          '<circle cx="22" cy="22" r="17" fill="none" stroke="rgba(35,40,46,.15)" stroke-width="4"/>' +
          '<circle cx="22" cy="22" r="17" fill="none" stroke="' + (frac > 0.9 ? '#c0392b' : '#2e8b57') +
            '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' +
            (frac * C).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 22 22)"/>' +
          '<text x="22" y="25" text-anchor="middle" font-size="10" fill="#23282e">' +
            Math.round(spent) + 's</text>' +
        '</svg>' +
        '<div>' +
          '<div class="kv"><span>clock</span><b>' + Math.round(spent) + ' / ' + CFG.CASE_S + ' s</b></div>' +
          '<div class="kv"><span>calls</span><b>' + rows.length + '</b></div>' +
          '<div class="kv"><span>WALLX calls</span><b>' + wallx + '</b></div>' +
        '</div>' +
      '</div>' +
      '<div class="kv"><span>latency mean / p95</span><b>' +
        (mean == null ? '—' : Math.round(mean) + ' / ' + Math.round(p95) + ' ms') + '</b></div>' +
      '<div class="kv"><span>parcels</span><b>' + esc(parcels) + '</b></div>' +
      '<div class="kv"><span>lane</span><b>' + esc(h.lane || '—') + '</b></div>' +
      '<div class="kv"><span>goal</span><b>' +
        esc(((S.meta && S.meta.goal) || (row && row.goal) || '—')).slice(0, 42) + '</b></div>';
  }

  /* ------------------------------------------------------------------ cameras */
  function renderCams(idx) {
    const wrap = $('cams');
    if (!wrap.dataset.built) {
      wrap.innerHTML = CFG.CAMERAS.map(function (c) {
        return '<figure><img id="cam_' + c + '" alt="' + c + '"><figcaption>' +
          c.replace('_', ' ') + '</figcaption></figure>';
      }).join('');
      wrap.dataset.built = '1';
      CFG.CAMERAS.forEach(function (c) {
        const img = $('cam_' + c);
        img.addEventListener('error', function () { img.style.opacity = '0.18'; });
        img.addEventListener('load', function () { img.style.opacity = '1'; });
      });
    }
    if (!S.id) return;
    CFG.CAMERAS.forEach(function (c) {
      const img = $('cam_' + c);
      const src = '/api/trials/' + encodeURIComponent(S.id) + '/frame/' + idx + '/' + c;
      if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
    });
  }

  /* ------------------------------------------------------------------ timeline */
  const STATE_COLORS = {
    IDLE: '#b9c3cd', SCAN: '#5b8def', LOOK: '#7c6ce0', SPIN: '#e0a13a', SHOW: '#2e8b57',
    SHOWSET: '#48a37a', SLIDE: '#c98a1b', SWIPE: '#c0392b', HOME: '#8a94a0', DONE: '#2e8b57',
    CALIB: '#8e44ad'
  };

  function rebuildTimeline() {
    const rows = S.rows, tl = $('timeline');
    if (!rows.length) { tl.innerHTML = '<div class="muted">waiting for a trial…</div>'; return; }
    const segs = [];
    rows.forEach(function (r, i) {
      const st = (r.harness && r.harness.state) || r.source || '—';
      const cur = segs[segs.length - 1];
      if (cur && cur.state === st) cur.to = i;
      else segs.push({ state: st, from: i, to: i });
    });
    const n = rows.length;
    let html = '<div class="tl">';
    segs.forEach(function (s) {
      html += '<div class="tlSeg" title="' + esc(s.state) + '" style="left:' + (s.from / n * 100).toFixed(2) +
        '%;width:' + ((s.to - s.from + 1) / n * 100).toFixed(2) + '%;background:' +
        (STATE_COLORS[s.state] || '#9aa6b2') + '"><span>' + esc(s.state) + '</span></div>';
    });
    rows.forEach(function (r, i) {
      const h = r.harness || {};
      if (h.transitions && h.transitions.length)
        html += '<div class="tlTick" style="left:' + (i / n * 100).toFixed(2) + '%"></div>';
    });
    html += '<div class="tlHead" id="tlHead"></div></div>';
    tl.innerHTML = html;
  }

  /* ------------------------------------------------------------------ log */
  function rebuildLog() {
    const entries = [];
    S.rows.forEach(function (r, i) {
      const h = r.harness || {};
      const prev = i ? ((S.rows[i - 1].harness || {}).state) : null;
      const bits = [];
      if (h.state && h.state !== prev) bits.push('→ ' + h.state);
      if (h.transitions && h.transitions.length) bits.push('transition ' + JSON.stringify(h.transitions));
      if (h.flags && h.flags.length) bits.push('flag ' + JSON.stringify(h.flags));
      if (h.codes && h.codes.length)
        bits.push('code ' + h.codes.map(function (c) { return String(c && c[0]); }).join(' '));
      if (r.error) bits.push('error ' + r.error);
      if (!bits.length) return;
      entries.push({ i: i, t: r.t, text: bits.join(' · ') });
    });
    const el = $('log');
    if (!entries.length) { el.innerHTML = '<div class="muted">nothing yet</div>'; return; }
    el.innerHTML = entries.map(function (e, k) {
      const ts = e.t ? new Date(e.t * 1000).toLocaleTimeString() : '';
      return '<div class="logRow" id="logrow_' + k + '"><span class="lt">' + ts + '</span>' + esc(e.text) + '</div>';
    }).join('');
  }

  function highlightLog(i) {
    const rows = $('log').children;
    let hi = -1;
    for (let k = 0; k < rows.length; k++) {
      if (!S.logEntries) break;
    }
    hi = S.logHi;
    if (!S.logIndex) return;
    hi = -1;
    for (let k = 0; k < S.logIndex.length; k++) if (S.logIndex[k] <= i) hi = k;
    if (hi === S.logHi) return;
    if (S.logHi >= 0 && $('logrow_' + S.logHi)) $('logrow_' + S.logHi).classList.remove('hi');
    if (hi >= 0 && $('logrow_' + hi)) {
      $('logrow_' + hi).classList.add('hi');
      if (S.follow) {
        const el = $('log');
        const r = $('logrow_' + hi);
        el.scrollTop = Math.max(0, r.offsetTop - el.clientHeight / 2);
      }
    }
    S.logHi = hi;
  }

  /* ------------------------------------------------------------------ data */
  async function api(path) {
    const r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) throw new Error(path + ' -> ' + r.status);
    return r.json();
  }

  function updateScrub() {
    const scrub = $('scrub');
    scrub.max = String(Math.max(0, S.rows.length - 1));
    scrub.value = String(clamp(Math.round(S.cursor), 0, S.rows.length - 1));
  }

  async function refreshTrials() {
    S.trials = await api('/api/trials');
    const sel = $('trialPicker');
    const keep = S.follow ? '__live__' : (S.id || '__live__');
    sel.innerHTML = '<option value="__live__">Live</option>' + S.trials.map(function (t) {
      const goal = (t.goal || '').slice(0, 24);
      return '<option value="' + t.id + '">' + t.id + ' · ' + esc(goal) + ' · ' + (t.calls || 0) + ' calls</option>';
    }).join('');
    sel.value = keep;
  }

  async function loadTrial(id) {
    S.id = id;
    S.after = -1;
    S.rows = [];
    S.pose = null;
    S.summary = null;
    S.prev = { left: null, right: null };
    S.trail = { left: [], right: [] };
    S.hist = { left: { z: [], g: [] }, right: { z: [], g: [] } };
    S.shownFrame = -1;
    S.logHi = -1;
    S.logIndex = [];
    S.logEntries = null;
    const d = await api('/api/trials/' + encodeURIComponent(id));
    S.meta = d.meta || {};
    S.summary = d.summary || null;
    S.rows = d.rows || [];
    const last = S.rows[S.rows.length - 1];
    S.after = last ? (Number.isFinite(last.index) ? last.index : S.rows.length - 1) : -1;
    S.cursor = Math.max(0, S.rows.length - 1);
    updateScrub();
    rebuildTimeline();
    rebuildLog();
    renderSlow(true);
  }

  async function poll() {
    if (S.busy) return;
    S.busy = true;
    try {
      if (S.follow) {
        const list = await api('/api/trials');
        S.trials = list;
        const newest = list.length ? list[0].id : null;
        if (newest && newest !== S.id) {
          await refreshTrials();
          await loadTrial(newest);
          return;
        }
      }
      if (!S.id) return;
      const add = await api('/api/trials/' + encodeURIComponent(S.id) + '/rows?after=' + S.after);
      if (add.length) {
        S.rows = S.rows.concat(add);
        const last = add[add.length - 1];
        S.after = Number.isFinite(last.index) ? last.index : S.after + add.length;
        updateScrub();
        rebuildTimeline();
        rebuildLog();
        renderSlow(true);
      }
      if (S.follow) S.cursor = Math.max(0, S.rows.length - 1);
      if (Date.now() - S.summaryAt > 2000) {
        S.summaryAt = Date.now();
        const d = await api('/api/trials/' + encodeURIComponent(S.id));
        S.summary = d.summary || null;
        S.meta = d.meta || S.meta;
      }
    } catch (e) {
      /* server not up yet / trial rotated under us: the next poll retries */
    } finally {
      S.busy = false;
    }
  }

  /* ------------------------------------------------------------------ slow render */
  function renderSlow(force) {
    const now = performance.now();
    if (!force && now - S.lastSlow < 130) return;
    S.lastSlow = now;
    const i = clamp(Math.round(S.cursor), 0, Math.max(0, S.rows.length - 1));
    const row = S.rows[i] || null;
    if (S.pose) renderPoseVals(S.pose);
    renderChips(row);
    renderPerf(row);
    if (row) {
      const idx = Number.isFinite(row.index) ? row.index : i;
      if (idx !== S.shownFrame) { S.shownFrame = idx; renderCams(idx); }
    }
    if (row !== S.shownRow) { S.shownRow = row; }
    if (S.logIndex && S.logIndex.length) highlightLog(i);
  }

  /* ------------------------------------------------------------------ loop */
  function rowRate() {
    const r = S.rows;
    if (r.length < 2) return 2;
    const span = Math.max(0.5, (r[r.length - 1].t || 0) - (r[0].t || 0));
    return clamp((r.length - 1) / span, 0.2, 10);
  }

  function setPlaying(v) {
    S.playing = !!v;
    $('playBtn').textContent = S.playing ? '⏸' : '▶';
  }

  function loop(now) {
    const dt = Math.min(0.15, (now - (S.lastPaint || now)) / 1000);
    S.lastPaint = now;
    if (S.follow && S.rows.length) S.cursor = S.rows.length - 1;
    else if (S.playing && S.rows.length > 1) {
      S.cursor = Math.min(S.rows.length - 1, S.cursor + dt * S.speed * rowRate());
      if (S.cursor >= S.rows.length - 1) setPlaying(false);
      updateScrub();
    }
    S.pose = smoothPose(S.pose, poseAt(S.cursor), dt);
    if (S.pose) paintScene(S.pose, rowAt(S.cursor));
    const head = $('tlHead');
    if (head && S.rows.length > 1)
      head.style.left = (S.cursor / (S.rows.length - 1) * 100).toFixed(2) + '%';
    renderSlow(false);
    requestAnimationFrame(loop);
  }

  /* ------------------------------------------------------------------ controls */
  function wireControls() {
    $('trialPicker').addEventListener('change', async function () {
      const v = $('trialPicker').value;
      setPlaying(false);
      if (v === '__live__') { S.follow = true; S.cursor = Math.max(0, S.rows.length - 1); return; }
      S.follow = false;
      try { await loadTrial(v); } catch (e) { /* keep the old view */ }
    });

    $('playBtn').addEventListener('click', function () {
      if (S.playing) { setPlaying(false); return; }
      if (!S.rows.length) return;
      S.follow = false;
      $('trialPicker').value = S.id || '__live__';
      if (S.cursor >= S.rows.length - 1) S.cursor = 0;
      setPlaying(true);
    });

    $('scrub').addEventListener('input', function () {
      S.follow = false;
      setPlaying(false);
      S.cursor = Number($('scrub').value) || 0;
    });

    const speeds = [0.5, 1, 2, 4];
    $('speeds').innerHTML = speeds.map(function (s) {
      return '<button data-speed="' + s + '"' + (s === 1 ? ' class="on"' : '') + '>' + s + 'x</button>';
    }).join('');
    $('speeds').addEventListener('click', function (e) {
      const b = e.target.closest('button');
      if (!b) return;
      S.speed = Number(b.dataset.speed) || 1;
      Array.prototype.forEach.call($('speeds').children, function (c) {
        c.className = c === b ? 'on' : '';
      });
    });

    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('playBtn').click(); }
    });
  }

  /* ------------------------------------------------------------------ boot */
  async function init() {
    buildStatic();
    buildChips();
    wireControls();
    requestAnimationFrame(loop);
    try { await refreshTrials(); } catch (e) { /* server starting */ }
    try {
      if (S.trials.length) await loadTrial(S.trials[0].id);
    } catch (e) { /* ignore */ }
    setInterval(poll, CFG.POLL_MS);
  }

  init();
})();
</script>
</body>
</html>
