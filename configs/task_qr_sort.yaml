# Lane sorter v6: parcels are swiped onto the table from the left. The head camera reads the QR label; no code -> SCRIPTED SPIN (one
# arm pushes the parcel so it rotates on the table, the head camera re-reads), then optionally INSPECT (WALLX flips it). We route by
# ZIP3 like a sortation computer; no handover by default: lane A (blue bin, robot's left) is placed by the LEFT arm, lane B (red,
# right) and the black reject bin (no label / garbage / unknown ZIP) by the RIGHT arm. A BIG parcel is lifted and placed by BOTH arms.
# CALIBRATE everything marked in sim / on the robot.

code_pattern: '^420/(\d{5})/\d{3}$'   # group 1 = ZIP5
sort_plan:                # ZIP3 prefix -> lane; anything else = no route -> black reject bin
  A: ["950", "951", "940", "941"]
  B: ["900", "901", "902"]
lanes: {A: blue, B: red}
arms: {A: left, B: right, reject: right}   # arm that places each lane / the reject bin (words in the PLACE / REJECT instructions)
handover: false           # true = the left arm finds the label, hands over, and the RIGHT arm places (arms is then ignored)
calib_test: false         # true = at episode start each arm holds its fingertips 0.10 m over known table points (no WALLX), logs expected head pixels
calib: {tip_h: 0.10, hold_calls: 4, move_calls: 2, pitches_deg: [90, 85, 80, 75, 70],   # steepest reachable pitch (90 = straight down); none -> point refused
        points: [[0.35, 0.10], [0.35, -0.10], [0.25, 0.0]]}   # root xy of the table points   # lane -> bin colour (a key of scene.bins, and the colour word WALLX hears)
max_parcels: null         # null = endless stream; N = DONE after N parcels (sim single-parcel cases use 1)

# Counts are MODEL CALLS (~2.1 s of motion each; WALLX takes ~9 s/call on top); the case budget is in ESTIMATED REAL SECONDS.
budget: {case_s: 480, deliver_reserve_s: 130, wallx_call_s: 11.0, scripted_call_s: 2.2, sim_case_s: null}   # per CASE / episode (every call counts, IDLE holds too); sim_case_s = the sim episode length when shorter (the sim batch sets it)
qr_confirm_frames: 2      # same value must decode in N consecutive calls
stable_calls: 2           # IDLE -> SCAN once the object has sat in the zone this many calls (the hand is gone)
settle_tol: 0.02          # ... and its presence fraction moved <= this between calls
scan_max_calls: 6         # kraft object, no confirmed decode after this many SCAN calls -> INSPECT (left arm turns it)
home_calls: 2             # HOME calls (scripted: no WALLX call), then VERIFY holds
scripted_home: true       # HOME drives back to the episode-start pose without a WALLX call; false = let WALLX do it
verify_calls: 2
spin:                     # scripted label search (SCAN -> SPIN): face-normal push near one end of a fitted face so the parcel yaws, re-read with the head camera, no WALLX call
  enabled: true
  tries: 4                # pushes per parcel; every try keeps turning the parcel the same way
  push_len: 0.04          # inward push along the face normal (m)
  out: 0.03               # the push starts this far outside the face, along its normal (m)
  reach_frac: 0.7         # contact point: this x the face half-length from the face centre (near a corner = yaw torque)
  face_min_dot: 0.3       # only faces whose normal points at the arm at least this much (cos)
  parcel_h: 0.08          # parcel height (m), not estimable: top-face height of the footprint fit; fingertips at table + clip(0.3 h, 0.015, 0.03)
  approach_h: 0.15        # via height above the table for the straight-down approach / retreat (m)
  fit_min: 0.04           # footprint fit refused (no push) unless both sides are in [fit_min, fit_max] m, aspect <= fit_aspect, blob fill >= fit_fill
  fit_max: 0.35
  fit_aspect: 5.0
  fit_fill: 0.6
  est_calls: 12           # budget estimate of one SPIN try in scripted calls (6 waypoints + home + re-read)
  gripper_closed: 0.0     # WALLX gripper units while pushing
  scan_calls: 3           # head re-read calls after the arm is home (qr_confirm_frames needs >= 2)
look:                     # scripted no-contact look-around (SCAN -> LOOK): the wrist camera takes oblique views, each gated by IK on the URDF chain, no WALLX call
  enabled: false          # off by default (SPIN replaces it); true = also try LOOK after SPIN, before INSPECT
  est_calls: 20           # budget estimate of LOOK in scripted calls
  arm_y: 0.29             # arm base = root + (0, +-arm_y, arm_z). From stock G-asset hints (sim quotes a right EE at (0.1185, -0.29, 0.211)); the URDF says 0.266 / 0.
  arm_z: 0.03             # CONFIRM both with point_test below
  point_test: false       # true = at SCAN -> LOOK hold the LEFT fingertips 0.10 m above the estimated parcel point (no WALLX): shows in the head image whether the frame is right
  standoff: 0.15          # camera horizontal distance from the parcel edge (m); fingertips are ~0.13 m ahead of the camera
  hw: 0.12                # parcel half-width when the head-mask footprint is unknown (m)
  cam_h: 0.22             # camera height above the table (m)
  sep_deg: 60             # views at least this far apart in azimuth around the parcel (deg); candidates every 15 deg over the near half-circle
  aim_down: 0.4           # optical axis this far below the target direction (rad): the label lands in the upper image half, the fingers cover the lower
  target_h: 0.05          # parcel half-height / aim point height above the table (m); the head ray is intersected at this height (the blob is mostly top + front face)
  finger_clear: 0.05      # fingertips stay this far from the parcel box and above the table (m)
  via_calls: 1            # calls lifting to a via-point (z_table + 0.30 above the current EE xy; the other arm goes home) before each view
  move_calls: 2           # calls driving to each view, then
  dwell_calls: 2          # calls holding there while codes are read (qr_confirm_frames needs >= 2)
ok_calls: 2               # outcome check passing this many consecutive calls ends an action state early
max_calls: {PUSH: 12, INSPECT: 8, HANDOVER: 10, PLACE: 20, REJECT: 20, LIFT2: 20}   # INSPECT per try, HANDOVER fixed (no success check)
tries: {PUSH: 0, INSPECT: 0, HANDOVER: 3, PLACE: 3, REJECT: 3, LIFT2: 3}   # attempts per parcel (0 = disabled); INSPECT: no code after the last -> no_label reject
                          # WALLX scores ~20-30%/attempt, retries carry it

# Front camera (RGB -> OpenCV HSV: H 0-179). Areas are fractions of the image area, kernels scale with width.
# kraft: calibrated on 1280x720 and 640x480 sim head frames of the old props (tests/data). CALIBRATE on head frames of the new boxes
# (sim, then venue light). Presence on the induction ROI (measured): package 1 ~0.23, package 2 ~0.4, small box ~0.05.
scene:
  kraft: [[8, 60, 60], [28, 155, 255]]   # V up to 255: lit tops of the real Amazon parcels read V 237-242. NOTE: the blue and red
                                         # boxes are kraft inside (photo H 17-18, S 120-140)
  induction_roi: [0.14, 0.45, 0.84, 0.98]   # CALIBRATE on the real table. x0, y0, x1, y1 fractions of the head image (scene v2 sim frames)
  bin_rois:               # CALIBRATE on the real table: head-image fractions of each bin's opening (scene v2 sim frames); black = reject bin
    blue: [0.29, 0.0, 0.49, 0.44]
    red: [0.51, 0.0, 0.745, 0.44]
    black: [0.74, 0.13, 0.97, 0.47]
  bin_gain: 0.015         # fraction of a bin ROI changed vs the snapshot taken when the parcel arrived = something landed in it (sim cube ~4%)
  presence_thr: 30        # blurred gray abs-diff vs the empty-zone reference
  presence_min: 0.01      # fraction of the ROI that differs = something is there
  big_presence: 0.32      # CALIBRATE: zone presence fraction >= this at SCAN = parcel too big for one gripper -> both arms
  kraft_min: 0.002        # fraction of the ROI that is kraft = a parcel (else garbage)
  ref_refresh_calls: 5    # IDLE sees an empty zone this many calls -> refresh the reference

# Wording, one sentence per call, as WALLX was trained; no arm selector, so the arm roles are in the words. {mat} -> blue|red|black,
# {obj} -> "block" (kraft) | "object". INSPECT cycles through its variants, one per try.
instruction_variant: 0
instructions:
  PUSH:
    - "push the {obj} onto the {mat} mat"
  INSPECT:
    - "pick up the {obj} with the left arm and turn it to show the label"
    - "pick up the {obj} with the left arm and turn it over"
    - "pick up the {obj} with the left arm and turn it around to find the label"
  INSPECT_BIG:
    - "lift the {obj} with both arms and turn it over"
  HANDOVER:
    - "hand the {obj} from the left arm to the right arm"
  PLACE:
    - "put the {obj} into the {mat} bin with the {arm} arm"
  REJECT:
    - "put the {obj} into the black bin with the {arm} arm"
  LIFT2:
    - "pick up the {obj} with both arms and put it into the {mat} bin"
  HOME:
    - "put both arms back to the home position"
