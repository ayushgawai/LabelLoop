# QR parcel sort task, harness v2. Gripper numbers are WALLX units (G gripper, 0 = closed, 1.526 = open).
# CALIBRATE on the real robot / sim: gripper bands, budgets, scene thresholds.

zones:            # code zone -> bin color. Bin comes from the code, never from box color.
  ZONE-A: blue
  ZONE-B: orange
code_pattern: '^LL\|(ZONE-[AB])\|\d{3}$'   # group 1 = zone

qr_confirm_frames: 2      # same value must decode in N consecutive model calls
agent_every: 4            # ask the vision agent every N model calls (optional; harness works with agent=None)

# Budgets are in MODEL CALLS (~1.6 s of sim motion each; WALLX takes 8-10 s/call), not wall time.
place_max_calls: 30
place_retries: 2          # PLACE budget expiries per code before it is treated as an unknown block (FETCH)
fetch_max_calls: 20
place_held_max_calls: 20
reject_max_calls: 15

# Calibrated in X2Real: closed-empty ~0.0, idle 0.1-0.25, holding a 60 mm cube = steady plateau 0.45-0.47, release > 0.6.
gripper:                  # applied to BOTH arms
  empty_max: 0.08         # at/below = closed on nothing
  hold_min: 0.30          # holding band (hold_min, hold_max) ...
  hold_max: 0.60
  hold_tol: 0.03          # ... and steady: |change| <= hold_tol between calls
  hold_calls: 2           # N consecutive steady in-band readings (after the arm opened) = holding
  open_min: 0.60          # at/above = open: arms the grasp detector, and releasing a held cube

# Front camera (RGB -> OpenCV HSV: H 0-179). Areas are fractions of the image area, kernels scale with width.
# Calibrated on 1280x720 and 640x480 sim head frames (tests/data): kraft S 60-155, bins S > 120.
scene:
  blue: [[95, 120, 80], [125, 255, 255]]
  orange: [[10, 150, 150], [30, 255, 255]]
  kraft: [[8, 60, 60], [28, 155, 200]]
  bin_min_area: 0.004
  block_min_area: 0.0015
  bin_gain: 0.0015        # kraft area (image fraction) that must appear inside a bin to count as a cube landing there

# Wording. {bin} -> blue|orange, {where} -> "on the left" | "in the middle" | "on the right".
# "put the block into the blue bin" sorted 2/2 zero-shot (results/phase4_case1_wording.md); engineered sub-goals failed 0/8.
instruction_variant: 0
instructions:
  PLACE:
    - "put the block {where} into the {bin} bin"
    - "put the block into the {bin} bin"
  FETCH:
    - "pick up the block {where}"
  PLACE_HELD:
    - "put the block into the {bin} bin"
  REJECT:
    - "put the block at the left edge of the table"
  DONE:
    - "put both arms back to the home position"
