# Robot conversion constants. The only numbers that should change between sim and event day.
embodiment: quanta_x1_pro/gripper-g

gripper:
  wallx_max: 1.526   # API Tutorial: real G gripper range [0, 1.526]
  sim_max: 1.89      # X2Real EX001-6R G gripper open (rad). Linear map between the two.

# Absolute EE home pose (default joints = 0) in the WALLX frame, meters / radians,
# R = Rz(yaw) Ry(pitch) Rx(roll). X2Real sends poses RELATIVE to this pose and does not
# send the absolute one, so it lives here.
# Frame = each arm's OWN base (<arm>_arm_base_link), not the shared robot root: X2Real's
# desktop EE dataset (meta/stats.json) has left-arm y in [-0.47, 0.18], impossible in the
# shared root where the left home sits at y=+0.266. Source:
#   python scripts/home_pose_from_urdf.py --urdf ex001_6r_legacy.urdf --root left_arm_base_link
# EE point = gripper_base_link (no TCP offset). Verify on the sim with the round-trip test
# (send current pose back as target -> arm must stay still), then "move right arm up 5 cm".
home_pose:
  left_ee:
    position: [0.1185, 0.0, 0.1810]
    rotation_rpy: [0.0, 0.0, 0.0]
  right_ee:
    position: [0.1185, 0.0, 0.1810]
    rotation_rpy: [0.0, 0.0, 0.0]
